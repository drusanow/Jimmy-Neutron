# Publishes the Neutron Editor web app (neutron-app/) to GitHub Pages.
# Enable once: repository Settings -> Pages -> Source: GitHub Actions
name: Neutron Editor on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['neutron-app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the web app
        run: |
          mkdir site
          cp -r neutron-app/index.html neutron-app/manifest.webmanifest neutron-app/sw.js \
                neutron-app/css neutron-app/js neutron-app/icons neutron-app/firmware site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
